version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jsh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: jsh_erp
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./jshERP-boot/docs/jsh_erp.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - '3307:3306'
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:6.2-alpine
    container_name: jsh-redis
    command: redis-server --requirepass 1234abcd
    ports:
      - '6380:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234abcd", "ping"]
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jsh-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '9999:9999'
    volumes:
      - ./upload:/opt/jshERP/upload
      - ./export:/opt/jshERP/export

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jsh-frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
